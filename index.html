يف الوظيفي</p></div>`).join('')}</div></section><section id="honor"><div class="section-head"><div><h2>الموظف المثالي</h2><p>تكريم أصحاب الأداء والإنجاز المتميز داخل الفرع.</p></div></div><div class="card" style="display:flex;gap:25px;align-items:center;flex-wrap:wrap"><div style="width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#d6bf86,#173b61);border:4px solid var(--gold)"></div><div><span class="tag">الموظف المثالي – سبتمبر 2026</span><h2 style="margin:10px 0;color:var(--navy)">يُحدد من الإدارة</h2><p style="color:var(--muted)">سيظهر هنا اسم الموظف وصورة التكريم وسبب الاختيار بعد اعتمادها.</p></div></div></section><section id="contact" style="background:var(--ivory)"><div class="section-head"><div><h2>تواصل معنا</h2><p>فرع تنفيذ شمال الصعيد – الشركة المساهمة المصرية للمقاولات (العبد).</p></div></div><div class="grid"><div class="card"><b>طلب تحديد موعد</b><p>للمقاولين والموردين والاستشاريين والجهات الخارجية.</p><button class="btn gold" onclick="appointment()">ابدأ الطلب</button></div><div class="card"><b>بوابة الموظفين</b><p>الخدمات الداخلية للموظفين وفق الصلاحيات.</p><button class="btn" style="background:var(--navy);color:white" onclick="login()">تسجيل الدخول</button></div><div class="card"><b>نطاق العمل</b><p>العاصمة الإدارية الجديدة، الفيوم، بني سويف، المنيا، أسيوط، سوهاج.</p></div></div></section></main><footer class="footer"><div><b>فرع تنفيذ شمال الصعيد</b><div style="margin-top:8px;color:#aebdce">منظومة مؤسسية للتنفيذ والمتابعة والخدمات.</div></div><div>© 2026 – جميع الحقوق محفوظة</div></footer></div>`}

function renderProfile(){document.getElementById('inside').innerHTML=`<div class="page-title"><h2>ملفي الوظيفي</h2><p>بياناتك الوظيفية الأساسية وسجل المسار الوظيفي.</p></div><div class="panel"><div class="profile">${[['كود الموظف',current.id],['الاسم',current.name],['الوظيفة',current.title],['الإدارة',current.dept],['المدير المباشر','مدير الإدارة المختصة'],['سنة التعيين','2018'],['نوع التعاقد','دائم'],['المؤهل','بكالوريوس هندسة'],['الجامعة','جامعة حكومية'],['التخصص','هندسة مدنية'],['الدرجة الوظيفية','الأولى'],['تاريخ آخر ترقية','2025'],['البريد الوظيفي',current.id.toLowerCase()+'@northupperegyptelabd.site'],['الهاتف الداخلي','02-XXXXXXX']].map(x=>`<div class="info"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div><div class="panel" style="margin-top:18px"><h3 style="color:var(--navy)">التقييمات السنوية</h3><table class="table"><tr><th>السنة</th><th>التقدير</th><th>الدرجة</th><th>المقيم</th><th>التاريخ</th></tr><tr><td>2025</td><td>ممتاز</td><td>92%</td><td>المدير المباشر</td><td>12/01/2026</td></tr><tr><td>2024</td><td>جيد جدًا</td><td>88%</td><td>المدير المباشر</td><td>10/01/2025</td></tr></table></div>`}
