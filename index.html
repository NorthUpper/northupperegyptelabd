function publicPage(id){const pages={about:['عن الفرع','نبذة تعريفية عن الفرع ونطاق العمل.','<div class="panel"><p style="line-height:2">فرع تنفيذ شمال الصعيد تابع للشركة المساهمة المصرية للمقاولات (العبد)، ويعمل في مجالات التشييد والبنية الأساسية والمرافق.</p><div class="grid"><div class="card"><h3>نطاق العمل</h3><p>العاصمة الإدارية الجديدة، الفيوم، بني سويف، المنيا، أسيوط، سوهاج.</p></div><div class="card"><h3>مجالات العمل</h3><p>التشييد، البنية الأساسية، شبكات المياه والصرف والمشروعات المرتبطة بخطط الدولة.</p></div><div class="card"><h3>المنصة</h3><p>منصة عامة وبوابة موظفين داخلية وفق الصلاحيات.</p></div></div></div>'],projects:['المشروعات والإنجازات','نماذج من مشروعات الفرع.','<div class="grid"><div class="card"><h3>محطة مياه طهطا وشبكاتها – سوهاج</h3><p>مشروع مياه وشبكات بمحافظة سوهاج.</p></div><div class="card"><h3>مشروعات البنية الأساسية</h3><p>تنفيذ ومتابعة مشروعات البنية الأساسية ضمن نطاق الفرع.</p></div><div class="card"><h3>العاصمة الإدارية الجديدة</h3><p>أعمال ومشروعات بالحي الأول – الأسبقية الأولى.</p></div></div>'],org:['الهيكل التنظيمي للفرع','قيادات الفرع والمسؤوليات الرئيسية.','<div class="cards"><div class="leader"><div style="font-size:55px">👤</div><h3>رئيس مجلس الإدارة غير التنفيذي</h3><p>تضاف الصورة بعد اعتمادها.</p></div><div class="leader"><img src="assets/saeed.jpg"><h3>م. سعيد فتوح عبد المولى</h3><p>رئيس مجلس الإدارة والعضو المنتدب</p></div><div class="leader"><img src="assets/ahmed.jpg"><h3>المهندس أحمد السيد علي</h3><p>مدير فرع تنفيذ شمال الصعيد</p></div><div class="leader"><img src="assets/taher.jpg"><h3>طاهر إسماعيل محمد</h3><p>المدير المالي للفرع</p></div></div>'],gallery:['معرض الصور','لقطات من أعمال ومشروعات الفرع.','<div class="gallery"><img src="assets/hero-bg.png"><img src="assets/hero-bg.png"><img src="assets/hero-bg.png"></div>'],decisions:['القرارات والمنشورات','محتوى عام منشور للزوار.','<div class="grid"><div class="card"><h3>قرارات ومنشورات الفرع</h3><p>هذه الصفحة العامة تعرض ما تم اعتماده للنشر.</p></div></div>'],training:['ا function login(){document.getElementById('app').innerHTML=`<main class="login"><div class="loginbox"><img class="logo" src="assets/logo.jpeg"><h1>بوابة خدمات الموظفين</h1><p>فرع تنفيذ شمال الصعيد</p><label>اسم المستخدم</label><input id="user" autocomplete="username" placeholder="مثال: NEE-00125"><label>كلمة المرور</label><div class="passwrap"><input id="pass" type="password" autocomplete="current-password" placeholder="••••••••"><button class="eye" type="button" onclick="togglePassword()" aria-label="إظهار كلمة المرور">◉</button></div><label class="remember"><input id="remember" type="checkbox"> تذكرني على هذا الجهاز</label><button class="loginbtn" onclick="doLogin()">تسجيل الدخول</button><button class="btn" style="width:100%;margin-top:10px" onclick="home()">العودة للموقع العام</button></div></main>`;try{const r=JSON.parse(localStorage.getItem('northRemember')||'null');if(r&&accounts[r.u]&&accounts[r.u].pass===r.p){user.value=r.u;pass.value=r.p;remember.checked=true}}catch(e){}}

function doLogin(){const u=document.getElementById('user').value.trim(),p=document.getElementById('pass').value;if(!accounts[u]||accounts[u].pass!==p){toast('اسم المستخدم أو كلمة المرور غير صحيحة');return}if(document.getElementById('remember').checked)localStorage.setItem('northRemember',JSON.stringify({u,p}));else localStorage.removeItem('northRemember');current={...accounts[u],id:u};internal()}
function can(k){return current&& (current.perms.includes('all')||current.perms.includes(k))}
function internal(){document.getElementById('app').innerHTML=`<div class="internal"><aside class="sidebar"><div class="sidebrand"><img src="assets/logo.jpeg"><div><b>شمال الصعيد</b><small>بوابة الموظفين</small></div></div><div class="sidemenu"><button onclick="dashboard()">⌂ لوحة التحكم</button><button onclick="profile()">👤 ملفي الوظيفي</button><b style="display:block;color:#7890a8;font-size:11px;padding:18px 12px 6px">الخدمات</b>${[['hr','👤 الموارد البشرية'],['warehouse','📦 المخازن'],['reports','📊 التقارير والمتابعة'],['employee','🏆 الموظف المثالي'],['training','🎓 التدريب'],['complaints','💬 الشكاوى والمقترحات'],['decisions','📜 القرارات والمنشورات'],['announcements','📣 إعلانات الموظفين'],['assets','🚗 الأصول والحركة'],['admin','⚙ الإدارة الفنية للنظام']].map(x=>`<button onclick="service('${x[0]}')">${x[1]}</button>`).join('')}<button onclick="logout()">↪ تسجيل الخروج</button></div></aside><main class="main"><header class="internalhead"><div><b>بوابة خدمات الموظفين</b><span style="color:#8996a7"> / ${esc(current.role)}</span></div><div><b>${esc(current.name)}</b> <button class="btn" onclick="logout()">تسجيل الخروج</button></div></header><div class="content" id="inside"></div></main></div>`;dashboard()}
function dashboard(){document.getElementById('inside').innerHTML=`<div class="welcome"><div><h1>مرحبًا بك، ${esc(current.name)}</h1><p>${esc(current.title)} • ${esc(current.dept)}</p></div><div>● الحساب نشط</div></div><div class="stats"><div class="stat">الإجازات المتاحة<b>21</b>يوم</div><div class="stat">طلبات قيد المتابعة<b>3</b>طلب</div><div class="stat">التقييم السنوي<b>92%</b></div><div class="stat">اكتمال الملف<b>88%</b></div></div><h2 style="color:var(--navy)">الخدمات المتاحة</h2><div class="servicegrid">${[['hr','👤','الموارد البشرية','الملف الوظيفي والإجازات وتقييم الأداء.'],['warehouse','📦','المخازن','الأصناف والكميات والمخازن.'],['reports','📊','التقارير والمتابعة','متابعة المشروعات والمؤشرات.'],['employee','🏆','الموظف المثالي','سجل التكريم والاختيار.'],['training','🎓','التدريب','البرامج والتسجيل والسجل التدريبي.'],['complaints','💬','الشكاوى والمقترحات','تقديم ومتابعة الطلبات.'],['decisions','📜','القرارات والمنشورات','محتوى داخلي للموظفين.'],['announcements','📣','الإعلانات','التنبيهات الداخلية.'],['assets','🚗','الأصول والحركة','السيارات والوحدات والحركة.'],['admin','⚙️','الإدارة الفنية للنظام','إدارة المستخدمين والمحتوى والصلاحيات.']].map(x=>`<div class="service" onclick="service('${x[0]}')"><div class="icon">${x[1]}</div><h3>${x[2]}</h3><p>${x[3]}</p><b style="font-size:12px;color:${can(x[0])?'var(--green)':'var(--red)'}">${can(x[0])?'✓ لديك صلاحية الدخول':'⊘ بدون صلاحية'}</b></div>`).join('')}</div>`}
function profile(){document.getElementById('inside').innerHTML=`<h2 style="color:var(--navy)">ملفي الوظيفي</h2><div class="panel"><div class="grid">${[['كود الموظف',current.id],['الاسم',current.name],['الوظيفة',current.title],['الإدارة',current.dept],['المدير المباشر','مدير الإدارة المختصة'],['سنة التعيين','2018'],['نوع التعاقد','دائم'],['المؤهل','بكالوريوس هندسة'],['آخر ترقية','2025']].map(x=>`<div class="card"><small style="color:var(--muted)">${x[0]}</small><h3 style="color:var(--navy)">${esc(x[1])}</h3></div>`).join('')}</div></div>`}
function service(k){if(!can(k)){document.getElementById('inside').innerHTML=`<div class="panel permission"><div class="lock">🔒</div><h2 style="color:var(--navy)">ليس لديك الصلاحية للدخول إلى هذه المنصة.</h2><button class="btn gold" onclick="dashboard()">العودة للوحة التحكم</button></div>`;return}const f={hr:hr,warehouse:warehouse,reports:reports,employee:employee,training:training,complaints:complaints,decisions:decisions,announcements:announcements,assets:assets,admin:admin};f[k]()}
function simple(title,text,action){document.getElementById('inside').innerHTML=`<div class="public-title"><h2>${title}</h2><p>${text}</p></div><div class="panel">${action||'<p>المحتوى سيظهر هنا.</p>'}</div>`}
function hr(){simple('الموارد البشرية','الملف الوظيفي والإجازات وتقييم الأداء.',`<div class="grid"><div class="card"><h3>الإجازة الاعتيادية</h3><p>الرصيد: 21 يومًا</p><button class="btn gold" onclick="toast('تم فتح طلب الإجازة')">طلب إجازة</button></div><div class="card"><h3>الإجازة العارضة</h3><p>الرصيد المتاح: 6 أيام</p><button class="btn gold" onclick="toast('تم فتح الطلب')">طلب إجازة</button></div><div class="card"><h3>تقييم الأداء</h3><p>آخر تقييم: ممتاز – 92%</p></div></div>`)}
function warehouse(){simple('منصة المخازن','ابحث عن الصنف قبل إنشاء طلب شراء.',`<input id="item" value="ماسورة HDPE 315"><button class="btn gold" style="margin-top:10px" onclick="toast('المتاح: 9,300 متر – مخازن سوهاج وأسيوط وبني سويف')">بحث</button>`)}
function reports(){simple('التقارير والمتابعة','لوحات متابعة المشروعات والمؤشرات.',`<div class="stats"><div class="stat">المشروعات النشطة<b>28</b></div><div class="stat">مشروعات بطيئة<b>6</b></div><div class="stat">التنفيذ المتوسط<b>78%</b></div><div class="stat">الصرف<b>71%</b></div></div>`)}
function employee(){simple('الموظف المثالي','سجل التكريم والاختيار.',`<div class="card"><h3>الموظف المثالي الحالي</h3><p>تضاف بيانات التكريم بعد الاعتماد.</p></div>`)}
function training(){simple('التدريب','البرامج المتاحة والتسجيل.',`<div class="grid"><div class="card"><h3>إدارة العقود وFIDIC</h3><p>24 ساعة – متاح للتسجيل.</p><button class="btn gold" onclick="toast('تم تسجيل طلبك في البرنامج')">طلب التسجيل</button></div><div class="card"><h3>إدارة المشروعات</h3><p>30 ساعة – متاح للتسجيل.</p><button class="btn gold" onclick="toast('تم تسجيل طلبك في البرنامج')">طلب التسجيل</button></div></div>`)}
function complaints(){simple('الشكاوى والمقترحات','تقديم الطلب ومتابعته.',`<label>نوع الطلب</label><select><option>مقترح</option><option>شكوى</option></select><label>الموضوع</label><input><label>التفاصيل</label><textarea rows="5"></textarea><button class="btn gold" style="margin-top:12px" onclick="toast('تم تسجيل الطلب برقم CMP-2026-014')">إرسال</button>`)}
function decisions(){simple('القرارات والمنشورات','محتوى داخلي للموظفين.',`<div class="card"><h3>تنظيم إجراءات العمل</h3><p>منشور بتاريخ 05/10/2026</p><button class="btn blue" onclick="toast('فتح القرار')">عرض</button></div>`)}
function announcements(){simple('إعلانات الموظفين','التنبيهات والتعليمات الداخلية.',`<div class="notice"><b>تنبيه:</b> سيتم تحديث بيانات تقييم الأداء السنوي خلال الأسبوع القادم.</div>`)}
function assets(){simple('الأصول والحركة','السيارات والوحدات السكنية والوقود والحركة.',`<div class="stats"><div class="stat">السيارات<b>18</b></div><div class="stat">بالخدمة<b>14</b></div><div class="stat">الوحدات السكنية<b>7</b></div><div class="stat">تحتاج متابعة<b>3</b></div></div>`)}
function admin(){document.getElementById('inside').innerHTML=`<div class="welcome"><div><h1>مرحبًا، ${esc(current.name)}</h1><p>لوحة تحكم تقنية المعلومات لإدارة محتوى الموقع والمستخدمين والصلاحيات.</p></div><b>IT Administrator</b></div><h2 style="color:var(--navy)">الإدارة السريعة</h2><div class="itgrid">${[['home','⌂','إدارة الصفحة الرئيسية','تعديل النصوص والصور والروابط.'],['content','▤','إدارة المحتوى','الأخبار والقرارات والمنشورات.'],['users','♟','إدارة الموظفين','إضافة وتعديل وتفعيل الحسابات.'],['permissions','◈','إدارة الصلاحيات','الأدوار والوصول للمنصات.'],['projects','▥','إدارة المشروعات','إضافة وتحديث المشروعات والإنجازات.'],['gallery','▧','معرض الصور','رفع الصور وترتيبها.'],['month','★','موظف الشهر','إضافة بيانات التكريم والنشر.'],['settings','⚙','الإعدادات العامة','العنوان والاتصال والبريد.']].map(x=>`<div class="itcard" onclick="itAction('${x[0]}')"><div class="icon">${x[1]}</div><h3>${x[2]}</h3><p>${x[3]}</p></div>`).join('')}</div><div class="panel" style="margin-top:20px"><h3 style="color:var(--navy)">سجل التعديلات</h3><table class="table"><tr><th>المستخدم</th><th>العملية</th><th>القسم</th><th>الحالة</th></tr><tr><td>${esc(current.name)}</td><td>تسجيل دخول</td><td>النظام</td><td>ناجح</td></tr><tr><td>${esc(current.name)}</td><td>مراجعة الصلاحيات</td><td>الموظفون</td><td>مكتمل</td></tr></table></div>`}
function itAction(k){const labels={home:'إدارة الصفحة الرئيسية',content:'إدارة المحتوى',users:'إدارة الموظفين',permissions:'إدارة الصلاحيات',projects:'إدارة المشروعات',gallery:'معرض الصور',month:'موظف الشهر',settings:'الإعدادات العامة'};document.getElementById('inside').innerHTML=`<button class="back" onclick="admin()">← العودة للوحة IT</button><div class="panel"><h2 style="color:var(--navy)">${labels[k]}</h2><p>هذه الشاشة مخصصة لموظف IT لإجراء التعديلات وحفظها. في النسخة الإنتاجية سيتم ربطها بقاعدة البيانات وتسجيل كل تعديل.</p><label>مثال على التعديل</label><input placeholder="أدخل البيانات الجديدة"><button class="btn gold" style="margin-top:15px" onclick="toast('تم حفظ التعديل في النسخة التجريبية')">حفظ التعديل</button></div>`}
function logout(){document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML=`<div class="modalbox"><h3 style="color:var(--navy)">تأكيد تسجيل الخروج</h3><p>هل تريد تسجيل الخروج؟</p><button class="btn" onclick="closeModal()">إلغاء</button> <button class="btn gold" onclick="confirmLogout()">تسجيل الخروج</button></div>`}
function closeModal(){document.getElementById('modal').className='hidden';document.getElementById('modal').innerHTML=''}function confirmLogout(){current=null;closeModal();home();toast('تم تسجيل الخروج بنجاح')}
home();
</script></body></html>
