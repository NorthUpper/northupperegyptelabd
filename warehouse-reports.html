function sendAppointment(){const name=document.getElementById('apName').value.trim(),phone=document.getElementById('apPhone').value.trim(),person=document.getElementById('apPerson').value,reason=document.getElementById('apReason').value.trim(),date=document.getElementById('apDate').value,details=document.getElementById('apDetails').value.trim();if(!name||!phone||!person||!reason||!date){toast('يرجى استكمال كل الحقول المطلوبة بعلامة *');return}const normalized=phone.replace(/[\s()-]/g,'');if(!/^(\+?20)?0?1[0125][0-9]{8}$/.test(normalized)){toast('راجِع رقم الهاتف؛ أدخل رقمًا مصريًا صحيحًا');return}const today=new Date();today.setHours(0,0,0,0);if(new Date(date+'T00:00:00')<today){toast('التاريخ المقترح لا يمكن أن يكون في الماضي');return}const list=readAppointments(),now=new Date(),id='APT-'+now.getFullYear()+'-'+String(Date.now()).slice(-6);list.unshift({id,name,phone,person,reason,date,details,status:'new',createdAt:now.toISOString(),history:[{status:'new',at:now.toISOString(),note:'تم تسجيل الطلب في النموذج التجريبي'}]});writeAppointments(list);document.getElementById('app').innerHTML=`<header class="top"><div></div><div class="brand"><img src="assets/logo.jpeg" alt="لوجو الشركة"><div><b>فرع تنفيذ شمال الصعيد</b><small>الشركة المساهمة المصرية للمقاولات (العبد)</small></div></div><button class="homeicon" onclick="home()">⌂</button></header><main class="screen"><div class="panel" style="max-width:720px;margin:30px auto;text-align:center"><div style="font-size:54px;color:var(--green)">✓</div><h2 style="color:var(--navy)">تم تسجيل طلبك في النموذج التجريبي</h2><p>رقم الطلب المرجعي</p><h2 style="color:var(--blue);direction:ltr">${esc(id)}</h2><p>الحالة: جديد — لم يتم إرساله إلى الفرع بعد.</p><button class="btn gold" onclick="home()">العودة للرئيسية</button><button class="btn blue" onclick="appointment()">تقديم طلب آخر</button></div></main>`;}

function exportAppointments(){const rows=readAppointments();if(!rows.length){toast('لا توجد طلبات لتصديرها');return}const cols=['id','name','phone','person','reason','date','time','details','status','createdAt'];const csv='\ufeff'+[cols.join(','),...rows.map(r=>cols.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='appointment-requests-demo.csv';a.click();URL.revokeObjectURL(url);toast('تم تجهيز ملف التصدير التجريبي')}

const LEAVE_STORE='northUpperLeaveRequestsV16';
const LEAVE_BASE_BALANCES={annual:21,casual:6}; // قيم توضيحية للنموذج فقط وليست أرصدة رسمية
function readLeaveRequests(){try{const v=JSON.parse(localStorage.getItem(LEAVE_STORE)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
function writeLeaveRequests(items){localStorage.setItem(LEAVE_STORE,JSON.stringify(items))}
function leaveDays(from,to){const a=new Date(from+'T12:00:00'),b=new Date(to+'T12:00:00');return Math.floor((b-a)/86400000)+1}
function leaveTypeKey(t){return t==='إجازة اعتيادية'?'annual':t==='إجازة عارضة'?'casual':null}
function statusLabel(st){return ({manager_pending:'بانتظار المدير المباشر',hr_pending:'بانتظار الموارد البشرية',approved:'معتمد نهائيًا',rejected:'مرفوض'})[st]||st}
function statusColor(st){return st==='approved'?'#d8f3e7':st==='rejected'?'#f8dede':st==='hr_pending'?'#dcecff':'#fff1b8'}
function leaveHistoryFor(id){return readLeaveRequests().filter(x=>x.employeeId===id)}
function leaveBalance(id){const reqs=leaveHistoryFor(id).filter(x=>x.status==='approved');const usedAnnual=reqs.filter(x=>leaveTypeKey(x.type)==='annual').reduce((n,x)=>n+x.days,0);const usedCasual=reqs.filter(x=>leaveTypeKey(x.type)==='casual').reduce((n,x)=>n+x.days,0);return {annual:Math.max(0,LEAVE_BASE_BALANCES.annual-usedAnnual),casual:Math.max(0,LEAVE_BASE_BALANCES.casual-usedCasual),usedAnnual,usedCasual}}
function hr(){const b=leaveBalance(current.id),reqs=leaveHistoryFor(current.id);document.getElementById('inside').innerHTML=`<div class="welcome"><div><h1>منصة الموارد البشرية</h1><p>مرحبًا ${esc(current.name)} • الإجازات والملف الوظيفي والتقييم والتدريب.</p></div><button class="btn gold" onclick="dashboard()">العودة للوحة الموظف</button></div><div class="stats"><div class="stat">رصيد الإجازة الاعتيادية <b>${b.annual}</b>يوم <small>توضيحي</small></div><div class="stat">رصيد الإجازة العارضة <b>${b.casual}</b>أيام <small>توضيحي</small></div><div class="stat">طلباتي قيد المتابعة<b>${reqs.filter(x=>!['approved','rejected'].includes(x.status)).length}</b>طلب</div><div class="stat">إجمالي طلباتي<b>${reqs.length}</b>طلب</div></div><div class="notice" style="margin:18px 0"><b>مهم:</b> هذه نسخة تجريبية؛ أرصدة الإجازات للتوضيح فقط. الطلبات تُحفظ في هذا المتصفح ولا تُرسل إشعارات حقيقية أو تُشارك بين أجهزة مختلفة.</div><h2 style="color:var(--navy)">خدمات الموارد البشرية</h2><div class="servicegrid"><div class="service" onclick="hrProfile()"><div class="icon">👤</div><h3>بياناتي الشخصية</h3><p>عرض ومراجعة بياناتك الوظيفية الأساسية.</p><b style="color:var(--blue)">عرض البيانات ←</b></div><div class="service" onclick="hrLeave()"><div class="icon">📅</div><h3>طلب إجازة</h3><p>تقديم طلب جديد مع التحقق من التاريخ وحساب المدة.</p><b style="color:var(--green)">تقديم طلب ←</b></div><div class="service" onclick="hrRequests()"><div class="icon">📋</div><h3>طلباتي</h3><p>متابعة الطلبات والحالة وسجل الإجراءات.</p><b style="color:var(--blue)">متابعة الطلبات ←</b></div><div class="service" onclick="hrEvaluation()"><div class="icon">⭐</div><h3>تقييم الأداء</h3><p>عرض نموذج توضيحي للتقييم ونقاط التطوير.</p><b style="color:var(--gold)">عرض التقييم ←</b></div><div class="service" onclick="training()"><div class="icon">🎓</div><h3>التدريب</h3><p>البرامج المتاحة والسجل التدريبي.</p><b style="color:var(--blue)">الدخول للتدريب ←</b></div><div class="service" onclick="decisions()"><div class="icon">📜</div><h3>القرارات والمنشورات</h3><p>الاطلاع على القرارات والمنشورات الداخلية.</p><b style="color:var(--blue)">عرض المحتوى ←</b></div></div>`}
function hrLeave(){document.getElementById('inside').innerHTML=`<button class="back" onclick="hr()">← العودة للموارد البشرية</button><div class="public-title"><h2>تقديم طلب إجازة</h2><p>أدخل بيانات الطلب. راجع المدة قبل الإرسال.</p></div><div class="panel"><div class="grid"><div><label for="leaveType">نوع الإجازة</label><select id="leaveType"><option>إجازة اعتيادية</option><option>إجازة عارضة</option><option>إجازة مرضية</option><option>إجازة وضع</option><option>إجازات أخرى</option></select></div><div><label for="leaveFrom">من تاريخ</label><input id="leaveFrom" type="date" min="2020-01-01" onchange="previewLeaveDays()"></div><div><label for="leaveTo">إلى تاريخ</label><input id="leaveTo" type="date" min="2020-01-01" onchange="previewLeaveDays()"></div></div><div id="leavePreview" class="notice" style="margin-top:15px">اختاري تاريخ البداية والنهاية لعرض عدد الأيام التقويمي التقديري.</div><label for="leaveNotes">ملاحظات (اختياري)</label><textarea id="leaveNotes" rows="4" maxlength="1000" placeholder="اكتبي ملاحظات مرتبطة بالطلب..."></textarea><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:15px"><button class="btn gold" onclick="submitLeave()">✈ إرسال الطلب</button><button class="btn blue" onclick="hrRequests()">متابعة طلباتي</button></div><p style="font-size:12px;color:var(--muted);line-height:1.8;margin-top:15px">عدد الأيام المعروض تقويمي للتوضيح فقط. احتساب أيام العمل والعطلات والمستندات المطلوبة يجب ضبطه طبقًا للائحة المعتمدة قبل التشغيل الفعلي.</p></div>`}
function previewLeaveDays(){const f=document.getElementById('leaveFrom')?.value,t=document.getElementById('leaveTo')?.value,box=document.getElementById('leavePreview');if(!box)return;if(!f||!t){box.textContent='اختاري تاريخ البداية والنهاية لعرض عدد الأيام التقويمي التقديري.';return}if(t<f){box.textContent='تاريخ النهاية يجب ألا يسبق تاريخ البداية.';box.style.borderRightColor='var(--red)';return}box.style.borderRightColor='var(--gold)';box.textContent='المدة التقويمية التقديرية: '+leaveDays(f,t)+' يومًا. سيتم التحقق من القواعد النهائية عند ربط اللائحة المعتمدة.'}
function submitLeave(){const type=document.getElementById('leaveType').value,from=document.getElementById('leaveFrom').value,to=document.getElementById('leaveTo').value,notes=document.getElementById('leaveNotes').value.trim();if(!from||!to){toast('من فضلك أدخلي تاريخ البداية والنهاية');return}if(to<from){toast('تاريخ النهاية لا يمكن أن يسبق تاريخ البداية');return}const days=leaveDays(from,to);if(!Number.isFinite(days)||days<1||days>366){toast('راجعي مدة الإجازة المدخلة');return}const requests=readLeaveRequests();const now=new Date();const id='LV-'+now.getFullYear()+'-'+String(Date.now()).slice(-6);const request={id,employeeId:current.id,employeeName:current.name,department:current.dept,type,from,to,days,notes,status:'manager_pending',createdAt:now.toISOString(),timeline:[{status:'manager_pending',by:current.name,at:now.toISOString(),note:'تم تقديم الطلب في النموذج التجريبي'}]};requests.unshift(request);writeLeaveRequests(requests);toast('تم تسجيل الطلب في النموذج التجريبي برقم '+id);hrRequests()}
function hrRequests(){const reqs=leaveHistoryFor(current.id);document.getElementById('inside').innerHTML=`<button class="back" onclick="hr()">← العودة للموارد البشرية</button><div class="public-title"><h2>طلباتي</h2><p>كل طلب جديد يظهر هنا مع حالته وسجل إجراءاته.</p></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px"><h2 style="margin:0;color:var(--navy)">طلبات الإجازات (${reqs.length})</h2><button class="btn gold" onclick="hrLeave()">+ طلب إجازة جديد</button></div>${reqs.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>رقم الطلب</th><th>نوع الطلب</th><th>من تاريخ</th><th>إلى تاريخ</th><th>المدة</th><th>الحالة</th><th>التفاصيل</th></tr></thead><tbody>${reqs.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.type)}</td><td>${esc(r.from)}</td><td>${esc(r.to)}</td><td>${r.days} يوم</td><td><span style="background:${statusColor(r.status)};padding:7px 10px;border-radius:18px;white-space:nowrap">${statusLabel(r.status)}</span></td><td><button class="btn" onclick="leaveDetails('${r.id}')">عرض</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="card" style="text-align:center;padding:35px"><div style="font-size:36px">📋</div><h3>لا توجد طلبات حتى الآن</h3><p>عند تقديم طلب إجازة سيظهر هنا برقم مرجعي وحالة واضحة.</p><button class="btn gold" onclick="hrLeave()">تقديم أول طلب</button></div>`}</div>`}
function leaveDetails(id){const r=readLeaveRequests().find(x=>x.id===id&&x.employeeId===current.id);if(!r){toast('لم يتم العثور على الطلب');return}document.getElementById('inside').innerHTML=`<button class="back" onclick="hrRequests()">← العودة إلى طلباتي</button><div class="public-title"><h2>تفاصيل الطلب ${esc(r.id)}</h2><p>تاريخ التقديم: ${new Date(r.createdAt).toLocaleString('ar-EG')}</p></div><div class="panel"><div class="grid"><div class="card"><small>نوع الإجازة</small><h3>${esc(r.type)}</h3></div><div class="card"><small>الفترة</small><h3>${esc(r.from)} — ${esc(r.to)}</h3></div><div class="card"><small>المدة التقويمية</small><h3>${r.days} يوم</h3></div></div><p><b>الحالة الحالية:</b> <span style="background:${statusColor(r.status)};padding:6px 10px;border-radius:14px">${statusLabel(r.status)}</span></p><p><b>الملاحظات:</b> ${esc(r.notes||'لا توجد ملاحظات')}</p><h3>سجل الإجراءات</h3><div>${r.timeline.map(t=>`<div class="notice" style="margin:10px 0"><b>${statusLabel(t.status)}</b><div>${esc(t.note)}</div><small>${esc(t.by)} • ${new Date(t.at).toLocaleString('ar-EG')}</small></div>`).join('')}</div></div>`}
function leaveInbox(){if(!(current?.perms.includes('all')||current?.perms.includes('leaveReview'))){toast('ليس لديك صلاحية مراجعة الإجازات');return}const isHR=current.role==='موارد بشرية';const list=readLeaveRequests().filter(r=>isHR?r.status==='hr_pending':r.status==='manager_pending');document.getElementById('inside').innerHTML=`<button class="back" onclick="dashboard()">← العودة للوحة التحكم</button><div class="public-title"><h2>${isHR?'مراجعة الموارد البشرية':'اعتمادات المدير المباشر'}</h2><p>${isHR?'الطلبات التي اجتازت مراجعة المدير المباشر وتنتظر قرار الموارد البشرية.':'طلبات الإجازات التي تنتظر مراجعة المدير المباشر.'}</p></div><div class="notice" style="margin-bottom:16px">مسار تجريبي: الموظف ← المدير المباشر ← الموارد البشرية. البيانات محفوظة في نفس المتصفح فقط.</div><div class="panel">${list.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>رقم الطلب</th><th>الموظف</th><th>النوع</th><th>الفترة</th><th>المدة</th><th>الإجراء</th></tr></thead><tbody>${list.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.employeeName)}<br><small>${esc(r.employeeId)}</small></td><td>${esc(r.type)}</td><td>${esc(r.from)} — ${esc(r.to)}</td><td>${r.days} يوم</td><td><button class="btn blue" onclick="reviewLeave('${r.id}')">مراجعة الطلب</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="card" style="text-align:center;padding:30px"><h3>لا توجد طلبات معلقة</h3><p>ستظهر الطلبات هنا بعد تقديمها من حساب موظف في هذا المتصفح.</p></div>`}</div>`}
function reviewLeave(id){const r=readLeaveRequests().find(x=>x.id===id);if(!r){toast('لم يتم العثور على الطلب');return}const isHR=current.role==='موارد بشرية';const expected=isHR?'hr_pending':'manager_pending';if(r.status!==expected){toast('تمت معالجة الطلب أو لا يخص مرحلة المراجعة الحالية');leaveInbox();return}document.getElementById('inside').innerHTML=`<button class="back" onclick="leaveInbox()">← العودة إلى قائمة الاعتمادات</button><div class="public-title"><h2>مراجعة طلب ${esc(r.id)}</h2><p>الموظف: ${esc(r.employeeName)} • ${esc(r.employeeId)}</p></div><div class="panel"><div class="grid"><div class="card"><small>نوع الإجازة</small><h3>${esc(r.type)}</h3></div><div class="card"><small>الفترة</small><h3>${esc(r.from)} — ${esc(r.to)}</h3></div><div class="card"><small>المدة التقويمية</small><h3>${r.days} يوم</h3></div></div><p><b>ملاحظات الموظف:</b> ${esc(r.notes||'لا توجد ملاحظات')}</p><label for="reviewNote">ملاحظة المراجع / سبب الرفض</label><textarea id="reviewNote" rows="3" maxlength="1000" placeholder="اكتب سبب الرفض عند اختيار الرفض، أو ملاحظة المراجعة..."></textarea><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:15px"><button class="btn gold" onclick="processLeave('${r.id}','approve')">${isHR?'اعتماد نهائي':'موافقة وإحالة للموارد البشرية'}</button><button class="btn" style="background:#f8dede;color:#982c2c" onclick="processLeave('${r.id}','reject')">رفض الطلب</button></div></div>`}
function processLeave(id,action){const list=readLeaveRequests(),i=list.findIndex(x=>x.id===id);if(i<0){toast('لم يتم العثور على الطلب');return}const r=list[i],isHR=current.role==='موارد بشرية';const expected=isHR?'hr_pending':'manager_pending';if(r.status!==expected){toast('لا يمكن اتخاذ الإجراء على هذه المرحلة');leaveInbox();return}const note=(document.getElementById('reviewNote')?.value||'').trim();if(action==='reject'&&!note){toast('اكتب سبب الرفض قبل تأكيد القرار');return}const now=new Date().toISOString();if(action==='reject'){r.status='rejected';r.timeline.push({status:'rejected',by:current.name,at:now,note:note||'تم رفض الطلب'});}else if(!isHR){r.status='hr_pending';r.timeline.push({status:'hr_pending',by:current.name,at:now,note:note||'وافق المدير المباشر وأُحيل الطلب للموارد البشرية'});}else{r.status='approved';r.timeline.push({status:'approved',by:current.name,at:now,note:note||'تم الاعتماد النهائي'});}list[i]=r;writeLeaveRequests(list);toast(action==='reject'?'تم تسجيل الرفض في النموذج التجريبي':isHR?'تم الاعتماد النهائي في النموذج التجريبي':'تمت الموافقة الأولية والإحالة للموارد البشرية');leaveInbox()}

function warehouse(){const d=whRead(),items=d.items;document.getElementById('inside').innerHTML=`<div class="public-title"><h2>منظومة المخازن</h2><p>إدارة حركة الأصناف والأرصدة والطلبات والرقابة على المخزون. <b>بيانات توضيحية للتجربة فقط.</b></p></div><div class="stats"><div class="stat">عدد الأصناف<b>${items.length}</b><small>أصناف في نموذج التجربة</small></div><div class="stat">قيمة المخزون التقديرية<b>${money(items.reduce((a,i)=>a+whTotal(i)*i.price,0))}</b></div><div class="stat">أصناف أقل من الحد الأدنى<b>${items.filter(i=>whTotal(i)-whReserved(i)<i.min).length}</b></div><div class="stat">طلبات مسجلة<b>${d.requests.length}</b><small>محفوظة في هذا المتصفح</small></div></div><div class="panel" style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h3 style="color:var(--navy);margin:0">دليل الأصناف والأرصدة</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn gold" onclick="whMoveForm('إضافة')">＋ إذن إضافة</button><button class="btn blue" onclick="whMoveForm('صرف')">− إذن صرف</button><button class="btn blue" onclick="whMoveForm('تحويل')">⇄ تحويل بين المخازن</button><button class="btn" style="background:#e9eef5" onclick="whRequestForm()">طلب احتياج</button></div></div><div class="grid" style="grid-template-columns:2fr 1fr 1fr;margin-top:15px"><div><label>بحث سريع بالاسم أو الكود</label><input id="whSearch" placeholder="مثال: ماسورة أو ITM-001" oninput="whRenderItems()"></div><div><label>المخزن</label><select id="whStoreFilter" onchange="whRenderItems()"><option value="">كل المخازن</option>${[...new Set(items.flatMap(i=>i.stores.map(s=>s.name)))].map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div><label>حالة الرصيد</label><select id="whStatusFilter" onchange="whRenderItems()"><option value="">الكل</option><option value="low">أقل من الحد الأدنى</option><option value="available">متاح للصرف</option></select></div></div><div id="whItemsTable" style="overflow:auto;margin-top:14px"></div></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="panel"><h3 style="color:var(--navy)">حركة المخزون الأخيرة</h3><div id="whMovesList"></div></div><div class="panel"><h3 style="color:var(--navy)">الرقابة والمتابعة</h3><div class="notice">تظهر الطلبات والحركات في هذا النموذج على نفس المتصفح فقط. الاعتماد الفعلي وتحديث أرصدة موحدة يتطلبان قاعدة بيانات وصلاحيات خادمية.</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn blue" onclick="whCounts()">محضر جرد تجريبي</button><button class="btn blue" onclick="whExport()">تصدير الأصناف CSV لفتحها في Excel</button><button class="btn" style="background:#e9eef5" onclick="whImportPrompt()">استيراد CSV من Excel</button></div><p id="whCountResult" style="color:var(--muted)">الجرد يسجل الملاحظات في نموذج التجربة، ولا يعد محضرًا رسميًا.</p></div></div>`;whRenderItems();whRenderMoves()}
function whRenderItems(){const d=whRead(),q=(document.getElementById('whSearch')?.value||'').trim().toLowerCase(),store=document.getElementById('whStoreFilter')?.value||'',status=document.getElementById('whStatusFilter')?.value||'';const list=d.items.filter(i=>(!q||(i.name+' '+i.id+' '+i.category).toLowerCase().includes(q))&&(!store||i.stores.some(s=>s.name===store))&&(!status||(status==='low'?whTotal(i)-whReserved(i)<i.min:whTotal(i)-whReserved(i)>0)));document.getElementById('whItemsTable').innerHTML=list.length?`<table class="table"><thead><tr><th>الكود / الصنف</th><th>المخزن</th><th>إجمالي الرصيد</th><th>محجوز</th><th>متاح</th><th>الحد الأدنى</th><th>القيمة التقديرية</th><th>الإجراء</th></tr></thead><tbody>${list.map(i=>i.stores.filter(s=>!store||s.name===store).map(s=>`<tr><td><b>${esc(i.name)}</b><br><small>${esc(i.id)} • ${esc(i.category)}</small></td><td>${esc(s.name)}</td><td>${s.qty.toLocaleString('en-US')} ${esc(i.unit)}</td><td>${s.reserved.toLocaleString('en-US')}</td><td><b style="color:${s.qty-s.reserved<i.min?'var(--red)':'var(--green)'}">${(s.qty-s.reserved).toLocaleString('en-US')}</b></td><td>${i.min.toLocaleString('en-US')}</td><td>${money(s.qty*i.price)}</td><td><button class="btn blue" style="padding:8px 10px" onclick="whMoveForm('صرف','${i.id}','${s.name}')">صرف</button></td></tr>`).join('')).join('')}</tbody></table>`:`<div class="card">لا توجد أصناف مطابقة للبحث.</div>`}
function whRenderMoves(){const d=whRead();document.getElementById('whMovesList').innerHTML=d.moves.length?`<table class="table"><tr><th>التاريخ</th><th>النوع</th><th>الصنف</th><th>الكمية</th><th>المشروع / المرجع</th></tr>${d.moves.slice(-6).reverse().map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.type)}</td><td>${esc(m.itemName)}</td><td>${m.qty} ${esc(m.unit)}</td><td>${esc(m.project||m.ref||'—')}</td></tr>`).join('')}</table>`:`<p style="color:var(--muted)">لا توجد حركات مسجلة في هذه الجلسة بعد.</p>`}
function whMoveForm(type,itemId='',storeName=''){const d=whRead(),item=d.items.find(i=>i.id===itemId);document.getElementById('inside').innerHTML=`<button class="back" onclick="warehouse()">← العودة للمخازن</button><div class="public-title"><h2>إذن ${type} مخزني</h2><p>أدخل بيانات الحركة للمراجعة في النموذج التجريبي.</p></div><div class="panel"><div class="notice">في النظام الفعلي يجب فصل إنشاء الإذن عن اعتماده وعن التنفيذ الفعلي، مع حفظ المستخدم والمستند والتاريخ.</div><form onsubmit="whSaveMove(event,'${type}')"><label>الصنف</label><select name="item" required>${d.items.map(i=>`<option value="${i.id}" ${i.id===itemId?'selected':''}>${esc(i.id)} — ${esc(i.name)}</option>`).join('')}</select><label>المخزن ${type==='تحويل'?'المصدر':'المعني'}</label><select name="store" required>${[...new Set(d.items.flatMap(i=>i.stores.map(s=>s.name)))].map(s=>`<option ${s===storeName?'selected':''}>${esc(s)}</option>`).join('')}</select>${type==='تحويل'?`<label>المخزن المحول إليه</label><select name="toStore" required>${[...new Set(d.items.flatMap(i=>i.stores.map(s=>s.name)))].map(s=>`<option>${esc(s)}</option>`).join('')}</select>`:''}<label>الكمية</label><input name="qty" type="number" min="0.001" step="any" required><label>المشروع المستفيد / المرجع</label><input name="project" placeholder="اسم المشروع أو رقم الطلب" ${type==='صرف'?'required':''}><label>رقم المستند</label><input name="ref" placeholder="رقم إذن / مستند"><label>ملاحظات</label><textarea name="notes" rows="2"></textarea><button class="btn gold" style="margin-top:16px" type="submit">تسجيل الحركة في النموذج</button></form></div>`}
function whSaveMove(e,type){e.preventDefault();const f=new FormData(e.target),d=whRead(),item=d.items.find(i=>i.id===f.get('item')),store=item.stores.find(s=>s.name===f.get('store')),qty=Number(f.get('qty'));if(!item||!store||!Number.isFinite(qty)||qty<=0){toast('راجع بيانات الحركة');return}if((type==='صرف'||type==='تحويل')&&store.qty-store.reserved<qty){toast(type==='تحويل'?'الكمية المحولة أكبر من المتاح في المخزن المصدر':'الكمية المطلوبة أكبر من المتاح للصرف');return}if(type==='تحويل'&&(!f.get('toStore')||f.get('toStore')===f.get('store'))){toast('اختر مخزنًا مختلفًا للتحويل');return}if(type==='إضافة')store.qty+=qty;else if(type==='صرف')store.qty-=qty;else{store.qty-=qty;let dest=item.stores.find(s=>s.name===f.get('toStore'));if(!dest){dest={name:f.get('toStore'),qty:0,reserved:0};item.stores.push(dest)}dest.qty+=qty}d.moves.push({id:'MOV-'+Date.now(),date:new Date().toISOString().slice(0,10),type,itemId:item.id,itemName:item.name,unit:item.unit,qty,store:store.name,toStore:f.get('toStore')||'',project:f.get('project')||'',ref:f.get('ref')||'',notes:f.get('notes')||'',status:'تجريبي — غير معتمد'});whWrite(d);toast('تم تسجيل الحركة في النموذج التجريبي');warehouse()}
function whRequestForm(){const d=whRead();document.getElementById('inside').innerHTML=`<button class="back" onclick="warehouse()">← العودة للمخازن</button><div class="public-title"><h2>طلب احتياج خامات لمشروع</h2><p>طلب تجريبي يوضح الاحتياج ونقص الرصيد وإمكانية التحويل من مخزن آخر.</p></div><div class="panel"><form onsubmit="whSaveRequest(event)"><label>المشروع</label><select name="project" required>${DEMO_PROJECTS.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select><label>الصنف</label><select name="item" required>${d.items.map(i=>`<option value="${i.id}">${esc(i.name)} — ${esc(i.unit)}</option>`).join('')}</select><label>الكمية المطلوبة</label><input name="qty" type="number" min="0.001" step="any" required><label>تاريخ الاحتياج</label><input name="date" type="date" min="${new Date().toISOString().slice(0,10)}" required><label>الأولوية</label><select name="priority"><option>عادي</option><option>عاجل</option><option>حرج — قد يؤثر على التنفيذ</option></select><label>مبرر الطلب</label><textarea name="reason" required rows="3"></textarea><button class="btn gold" style="margin-top:15px">تسجيل طلب الاحتياج</button></form></div>`}
function whSaveRequest(e){e.preventDefault();const f=new FormData(e.target),d=whRead(),i=d.items.find(x=>x.id===f.get('item'));d.requests.push({id:'REQ-'+Date.now(),project:f.get('project'),itemId:i.id,itemName:i.name,qty:Number(f.get('qty')),date:f.get('date'),priority:f.get('priority'),reason:f.get('reason'),status:'بانتظار المراجعة',by:current.name});whWrite(d);toast('تم تسجيل الطلب في النموذج التجريبي');warehouse()}
function whCounts(){const d=whRead();d.counts.push({date:new Date().toISOString().slice(0,10),by:current.name,items:d.items.length,note:'محضر جرد تجريبي غير رسمي'});whWrite(d);document.getElementById('whCountResult').textContent='تم تسجيل بدء جرد تجريبي بتاريخ '+d.counts[d.counts.length-1].date+' — يلزم إدخال الكميات الفعلية ومراجعتها قبل أي اعتماد.';toast('تم إنشاء سجل جرد تجريبي')}
function whExport(){const d=whRead(),rows=[['الكود','الصنف','الفئة','المخزن','الوحدة','الرصيد','المحجوز','المتاح','الحد الأدنى','سعر الوحدة التقديري']];d.items.forEach(i=>i.stores.forEach(s=>rows.push([i.id,i.name,i.category,s.name,i.unit,s.qty,s.reserved,s.qty-s.reserved,i.min,i.price])));csvDownload('warehouse_items_demo.csv',rows)}
function whImportPrompt(){document.getElementById('inside').innerHTML=`<button class="back" onclick="warehouse()">← العودة للمخازن</button><div class="panel"><h2 style="color:var(--navy)">استيراد أصناف من Excel</h2><p>احفظ الملف من Excel بصيغة CSV UTF-8. يجب أن يحتوي الأعمدة: الكود، الصنف، الفئة، المخزن، الوحدة، الرصيد، المحجوز، الحد الأدنى، سعر الوحدة. الاستيراد يحدّث نموذج المتصفح فقط، ولا يغيّر قاعدة بيانات فعلية.</p><input type="file" id="whCsvFile" accept=".csv,text/csv"><button class="btn gold" style="margin-top:15px" onclick="whImportCsv()">قراءة ملف CSV</button><div id="whImportResult"></div></div>`}
function parseCSV(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());return lines.map(line=>{let out=[],cur='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'&&q&&line[i+1]==='"'){cur+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out})}
function whImportCsv(){const file=document.getElementById('whCsvFile').files[0];if(!file){toast('اختاري ملف CSV أولًا');return}const reader=new FileReader();reader.onload=()=>{try{const rows=parseCSV(reader.result),head=rows.shift().map(x=>x.trim().toLowerCase()),idx=(...names)=>head.findIndex(h=>names.includes(h)),ix={id:idx('الكود','code','item code'),name:idx('الصنف','الاسم','name','item'),cat:idx('الفئة','category'),store:idx('المخزن','store','warehouse'),unit:idx('الوحدة','unit'),qty:idx('الرصيد','الكمية','qty','quantity'),res:idx('المحجوز','reserved'),min:idx('الحد الأدنى','min','minimum'),price:idx('سعر الوحدة التقديري','سعر الوحدة','price')};if(ix.id<0||ix.name<0||ix.store<0||ix.qty<0){throw Error('الأعمدة الأساسية غير موجودة. راجعي دليل الأعمدة.')}const d=whRead();let count=0;rows.forEach(r=>{if(!r[ix.id]||!r[ix.name])return;let it=d.items.find(i=>i.id===r[ix.id]);if(!it){it={id:r[ix.id],name:r[ix.name],category:r[ix.cat]||'غير مصنف',unit:r[ix.unit]||'وحدة',min:Number(r[ix.min])||0,price:Number(r[ix.price])||0,stores:[]};d.items.push(it)}it.name=r[ix.name];it.category=r[ix.cat]||it.category;it.unit=r[ix.unit]||it.unit;it.min=Number(r[ix.min])||it.min;it.price=Number(r[ix.price])||it.price;let st=it.stores.find(s=>s.name===r[ix.store]);if(!st){st={name:r[ix.store],qty:0,reserved:0};it.stores.push(st)}st.qty=Number(r[ix.qty])||0;st.reserved=Number(r[ix.res])||0;count++});whWrite(d);document.getElementById('whImportResult').innerHTML=`<div class="notice" style="margin-top:15px">تمت قراءة ${count} صفًا في النموذج التجريبي. راجعي الأصناف والأرصدة قبل استخدامها في أي قرار.</div><button class="btn blue" onclick="warehouse()">عرض الأصناف</button>`}catch(err){document.getElementById('whImportResult').innerHTML=`<div class="notice" style="margin-top:15px">تعذر الاستيراد: ${esc(err.message)}</div>`}};reader.readAsText(file,'UTF-8')}
function csvDownload(name,rows){const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function reports(){const projects=DEMO_PROJECTS;document.getElementById('inside').innerHTML=`<div class="public-title"><h2>التخطيط والمتابعة — لوحة المشروعات</h2><p>لوحة تنفيذية مرتبطة ببطاقات المشروعات والتحديثات الأسبوعية والتقرير الشهري. جميع بيانات المشروعات أدناه توضيحية وليست بيانات فعلية للفرع.</p></div><div class="welcome"><div><h1>ملخص موقف المشروعات</h1><p>من المؤشر إلى المشروع ثم المعوق والإجراء والمسؤول.</p></div><div><button class="btn gold" onclick="projectUpdateForm()">＋ تحديث أسبوعي</button> <button class="btn" style="background:#fff;color:var(--navy)" onclick="monthlyReport()">التقرير الشهري</button></div></div><div class="stats"><div class="stat">المشروعات في النموذج<b>${projects.length}</b><small>عدد توضيحي</small></div><div class="stat">متأخرة / تحتاج تدخلًا<b>${projects.filter(p=>p.status!=='منتظم').length}</b></div><div class="stat">متوسط التنفيذ المخطط<b>${Math.round(projects.reduce((a,p)=>a+p.planned,0)/projects.length)}%</b></div><div class="stat">متوسط التنفيذ الفعلي<b>${Math.round(projects.reduce((a,p)=>a+p.actual,0)/projects.length)}%</b></div></div><div class="panel" style="margin-bottom:18px"><div class="grid" style="grid-template-columns:1fr 1fr 1fr"><div><label>المحافظة</label><select id="prGov" onchange="projectTable()"><option value="">كل المحافظات</option>${[...new Set(projects.map(p=>p.gov))].map(g=>`<option>${esc(g)}</option>`).join('')}</select></div><div><label>حالة المشروع</label><select id="prStatus" onchange="projectTable()"><option value="">كل الحالات</option><option>منتظم</option><option>متأخر</option><option>يحتاج تدخل</option></select></div><div><label>بحث عن مشروع</label><input id="prSearch" oninput="projectTable()" placeholder="اسم المشروع أو رقمه"></div></div><div id="projectTable" style="overflow:auto;margin-top:14px"></div></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="panel"><h3 style="color:var(--navy)">المعوقات والإجراءات المستحقة</h3>${projects.filter(p=>p.status!=='منتظم').map(p=>`<div class="card" style="margin:10px 0"><b>${esc(p.name)}</b><p>${esc(p.blocker)}</p><small>الإجراء: ${esc(p.action)}<br>المسؤول: ${esc(p.owner)}<br>الموعد: ${esc(p.due)}</small><div style="margin-top:10px"><button class="btn blue" onclick="projectDetail('${p.id}')">فتح بطاقة المشروع</button></div></div>`).join('')}</div><div class="panel"><h3 style="color:var(--navy)">المنهج المقترح للتحديث</h3><ol style="line-height:2"><li>تحديث أسبوعي مختصر للفعلي والمعوقات والإجراءات.</li><li>مراجعة مدير المحافظة قبل تجميع التقرير.</li><li>إقفال الشهر بتقرير معتمد مع تاريخ ومعدّ ومراجع.</li><li>الاحتفاظ بالتحديثات السابقة لقياس تطور المشروع.</li></ol><button class="btn gold" onclick="projectUpdateForm()">إدخال تحديث أسبوعي</button> <button class="btn blue" onclick="monthlyReport()">تجهيز التقرير الشهري</button></div></div>`;projectTable()}
function projectTable(){const gov=document.getElementById('prGov')?.value||'',status=document.getElementById('prStatus')?.value||'',q=(document.getElementById('prSearch')?.value||'').toLowerCase();const ps=DEMO_PROJECTS.filter(p=>(!gov||p.gov===gov)&&(!status||p.status===status)&&(!q||(p.name+' '+p.id).toLowerCase().includes(q)));const el=document.getElementById('projectTable');if(!el)return;el.innerHTML=ps.length?`<table class="table"><thead><tr><th>المشروع / المحافظة</th><th>المخطط</th><th>الفعلي</th><th>الانحراف</th><th>الصرف من الاعتماد</th><th>الحالة</th><th>التفاصيل</th></tr></thead><tbody>${ps.map(p=>`<tr><td><b>${esc(p.name)}</b><br><small>${esc(p.id)} • ${esc(p.gov)}</small></td><td>${p.planned}%</td><td>${p.actual}%</td><td style="color:${p.actual<p.planned?'var(--red)':'var(--green)'}">${p.actual-p.planned} نقطة</td><td>${Math.round(p.spent/p.approval*100)}%</td><td><span style="font-weight:800;color:${p.status==='منتظم'?'var(--green)':'var(--red)'}">${esc(p.status)}</span></td><td><button class="btn blue" style="padding:8px 10px" onclick="projectDetail('${p.id}')">فتح الملف</button></td></tr>`).join('')}</tbody></table>`:`<div class="card">لا توجد مشروعات مطابقة.</div>`}
function projectDetail(id){const p=DEMO_PROJECTS.find(x=>x.id===id);if(!p)return;const updates=JSON.parse(localStorage.getItem('northUpperProjectUpdatesV1')||'[]').filter(u=>u.projectId===id);const actions=JSON.parse(localStorage.getItem('northUpperProjectActionsV1')||'[]').filter(a=>a.projectId===id);document.getElementById('inside').innerHTML=`<button class="back" onclick="reports()">← العودة إلى لوحة المشروعات</button><div class="public-title"><h2>${esc(p.name)}</h2><p>${esc(p.id)} • ${esc(p.gov)} • ${esc(p.type)} • ${esc(p.manager)}</p></div><div class="stats"><div class="stat">قيمة العقد<b>${money(p.contract)}</b></div><div class="stat">الاعتماد المالي<b>${money(p.approval)}</b></div><div class="stat">الصرف التراكمي<b>${money(p.spent)}</b></div><div class="stat">نسبة التنفيذ الفعلي<b>${p.actual}%</b></div></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="panel"><h3 style="color:var(--navy)">الموقف التنفيذي</h3><p>المخطط: <b>${p.planned}%</b> — الفعلي: <b>${p.actual}%</b></p><div style="height:12px;background:#e8edf3;border-radius:9px;overflow:hidden"><div style="height:100%;width:${p.actual}%;background:var(--navy)"></div></div><p>الانحراف: <b style="color:var(--red)">${p.actual-p.planned} نقطة مئوية</b></p><p>تاريخ البداية: ${esc(p.start)}<br>تاريخ الانتهاء التعاقدي: ${esc(p.end)}<br>آخر تحديث: ${esc(p.updated)}</p></div><div class="panel"><h3 style="color:var(--navy)">الموقف المالي</h3><p>المتبقي من الاعتماد: <b>${money(p.approval-p.spent)}</b></p><p>نسبة الصرف من الاعتماد: <b>${Math.round(p.spent/p.approval*100)}%</b></p><p>يجب في النسخة التشغيلية توضيح هل الصرف تراكمي فعلي أم قيمة مستخلصات، مع مصدر وتاريخ آخر تحديث.</p></div></div><div class="panel" style="margin-top:18px"><h3 style="color:var(--navy)">المعوق والإجراء المطلوب</h3><div class="notice"><b>المعوق:</b> ${esc(p.blocker)}<br><b>الإجراء:</b> ${esc(p.action)}<br><b>المسؤول:</b> ${esc(p.owner)}<br><b>الموعد المستهدف:</b> ${esc(p.due)}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn gold" onclick="projectUpdateForm('${p.id}')">تسجيل تحديث أسبوعي</button><button class="btn blue" onclick="monthlyReport('${p.id}')">إضافة للتقرير الشهري</button><button class="btn" style="background:#e9eef5" onclick="projectActionForm('${p.id}')">تسجيل إجراء / قرار</button></div></div><div class="panel" style="margin-top:18px"><h3 style="color:var(--navy)">سجل التحديثات</h3>${updates.length?`<table class="table"><tr><th>التاريخ</th><th>الفعلي</th><th>المعوقات</th><th>الإجراء التالي</th></tr>${updates.slice().reverse().map(u=>`<tr><td>${esc(u.date)}</td><td>${u.actual}%</td><td>${esc(u.blocker||'—')}</td><td>${esc(u.action||'—')}</td></tr>`).join('')}</table>`:'<p>لا توجد تحديثات مضافة في هذا المتصفح حتى الآن.</p>'}</div><div class="panel" style="margin-top:18px"><h3 style="color:var(--navy)">سجل الإجراءات والقرارات</h3>${actions.length?`<table class="table"><tr><th>النوع</th><th>الإجراء</th><th>المسؤول</th><th>الموعد</th><th>الحالة</th></tr>${actions.slice().reverse().map(a=>`<tr><td>${esc(a.type)}</td><td>${esc(a.desc)}</td><td>${esc(a.owner)}</td><td>${esc(a.due)}</td><td>${esc(a.status)}</td></tr>`).join('')}</table>`:'<p>لا توجد إجراءات مسجلة لهذا المشروع في النموذج حتى الآن.</p>'}</div>`}
function projectUpdateForm(id=''){const p=DEMO_PROJECTS.find(x=>x.id===id)||DEMO_PROJECTS[0];document.getElementById('inside').innerHTML=`<button class="back" onclick="${id?`projectDetail('${id}')`:'reports()'}">← العودة</button><div class="public-title"><h2>تحديث أسبوعي مختصر</h2><p>يسجل موقف التنفيذ والمعوقات والإجراءات للأسبوع الحالي.</p></div><div class="panel"><form onsubmit="saveProjectUpdate(event)"><label>المشروع</label><select name="projectId">${DEMO_PROJECTS.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><label>تاريخ التحديث</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required><div class="grid" style="grid-template-columns:1fr 1fr"><div><label>نسبة التنفيذ الفعلي (%)</label><input name="actual" type="number" min="0" max="100" step="0.1" value="${p.actual}" required></div><div><label>مستهدف الأسبوع القادم (%)</label><input name="nextTarget" type="number" min="0" max="100" step="0.1" value="${Math.min(100,p.actual+3)}" required></div></div><label>ما تم خلال الأسبوع</label><textarea name="done" rows="2" placeholder="الأعمال المنفذة والنتائج"></textarea><label>المعوقات الحالية وأثرها</label><textarea name="blocker" rows="2" placeholder="اكتب لا يوجد إذا لم توجد معوقات"></textarea><label>الإجراء المطلوب والمسؤول</label><textarea name="action" rows="2" placeholder="الإجراء، المسؤول، والموعد المستهدف"></textarea><label>ملاحظات / مستندات مرجعية</label><textarea name="notes" rows="2"></textarea><button class="btn gold" style="margin-top:15px">حفظ التحديث التجريبي</button></form></div>`}
function saveProjectUpdate(e){e.preventDefault();const f=new FormData(e.target);let updates=[];try{updates=JSON.parse(localStorage.getItem('northUpperProjectUpdatesV1')||'[]')}catch(_){}const u={id:'UPD-'+Date.now(),projectId:f.get('projectId'),date:f.get('date'),actual:Number(f.get('actual')),nextTarget:Number(f.get('nextTarget')),done:f.get('done'),blocker:f.get('blocker'),action:f.get('action'),notes:f.get('notes'),by:current.name,stage:'مسودة تجريبية — غير معتمدة'};updates.push(u);localStorage.setItem('northUpperProjectUpdatesV1',JSON.stringify(updates));const p=DEMO_PROJECTS.find(x=>x.id===u.projectId);if(p){p.actual=u.actual;p.updated=u.date;p.nextTarget=u.nextTarget;if((u.blocker||'').trim()&&!/لا يوجد|لا توجد|بدون معوقات/i.test(u.blocker)){p.blocker=u.blocker;p.status=p.actual<p.planned-5?'متأخر':'يحتاج تدخل'}else{p.blocker='لا يوجد معوق حرج مسجل';p.status=p.actual<p.planned-5?'متأخر':'منتظم'}if((u.action||'').trim())p.action=u.action;p.updatedBy=current.name;saveDemoProjects()}toast('تم حفظ التحديث وتحديث بطاقة المشروع في هذا المتصفح فقط');projectDetail(u.projectId)}

function monthlyReport(id=''){const ps=DEMO_PROJECTS.filter(p=>!id||p.id===id);document.getElementById('inside').innerHTML=`<button class="back" onclick="${id?`projectDetail('${id}')`:'reports()'}">← العودة</button><div class="public-title"><h2>التقرير الشهري للتخطيط والمتابعة</h2><p>قالب مراجعة وتجميع قبل الاعتماد الرسمي — بيانات توضيحية.</p></div><div class="panel"><div class="grid" style="grid-template-columns:1fr 1fr 1fr"><div><label>شهر التقرير</label><input type="month" id="monthlyPeriod" value="${new Date().toISOString().slice(0,7)}"></div><div><label>إعداد التقرير</label><input value="${esc(current.name)}" readonly></div><div><label>حالة التقرير</label><input value="مسودة تجريبية — غير معتمدة" readonly></div></div><div style="overflow:auto;margin-top:18px"><table class="table"><tr><th>المشروع</th><th>المخطط</th><th>الفعلي</th><th>الانحراف</th><th>الاعتماد</th><th>الصرف</th><th>المعوق / الإجراء</th></tr>${ps.map(p=>`<tr><td>${esc(p.name)}<br><small>${esc(p.gov)}</small></td><td>${p.planned}%</td><td>${p.actual}%</td><td>${p.actual-p.planned} نقطة</td><td>${money(p.approval)}</td><td>${money(p.spent)}</td><td>${esc(p.blocker)}<br><small>${esc(p.action)} — ${esc(p.owner)}</small></td></tr>`).join('')}</table></div><label>ملخص مدير التخطيط والمتابعة</label><textarea id="monthlySummary" rows="3" placeholder="أهم النتائج والانحرافات والإجراءات المطلوب اعتمادها"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn gold" onclick="exportMonthly()">تصدير جدول التقرير إلى Excel (CSV)</button><button class="btn blue" onclick="toast('هذه مسودة تجريبية؛ الاعتماد الإلكتروني غير مفعل')">إرسال للمراجعة (عرض فقط)</button></div></div>`;window.__monthlyProjectIds=ps.map(p=>p.id)}
function exportMonthly(){const ids=window.__monthlyProjectIds||[],ps=DEMO_PROJECTS.filter(p=>ids.includes(p.id)),period=document.getElementById('monthlyPeriod')?.value||'',rows=[['شهر التقرير',period],[],['رقم المشروع','اسم المشروع','المحافظة','التنفيذ المخطط %','التنفيذ الفعلي %','الانحراف بالنقاط','الاعتماد المالي','الصرف التراكمي','المعوق','الإجراء','المسؤول','الموعد المستهدف']];ps.forEach(p=>rows.push([p.id,p.name,p.gov,p.planned,p.actual,p.actual-p.planned,p.approval,p.spent,p.blocker,p.action,p.owner,p.due]));rows.push([],['ملخص مدير التخطيط والمتابعة',document.getElementById('monthlySummary')?.value||'']);csvDownload('monthly_project_report_demo.csv',rows)}

function assets(){const vehicles=assetRead('vehicles'),trips=assetRead('trips'),rentals=assetRead('rentals'),equipment=assetRead('equipment');const openTrips=trips.filter(t=>t.status!=='مغلق').length,soon=rentals.filter(r=>{const d=(new Date(r.end)-new Date())/86400000;return d>=0&&d<=60}).length,maintenance=equipment.filter(a=>a.condition!=='صالح').length;document.getElementById('inside').innerHTML=`<div class="asset-head"><div><div class="kicker">ASSET & FLEET CONTROL</div><h1>إدارة الأصول والحركة والالتزامات</h1><p>رقابة تشغيلية ومالية على السيارات والمأموريات والعقارات المؤجرة والمعدات المملوكة.</p></div><span class="demo-flag">نموذج تجريبي — البيانات ليست سجلات فعلية</span></div><div class="notice">تنبيه: البيانات تحفظ في هذا المتصفح فقط. الاعتماد الإلكتروني الفعلي، والتنبيهات بين المستخدمين، ومنع الصرف على مستوى الشركة تتطلب خادمًا وقاعدة بيانات وصلاحيات خلفية.</div><div class="asset-kpis"><div class="asset-kpi"><small>السيارات المسجلة</small><b>${vehicles.length}</b><span>مملوكة أو مؤجرة</span></div><div class="asset-kpi"><small>مأموريات مفتوحة</small><b>${openTrips}</b><span>تحتاج استكمال أو مراجعة</span></div><div class="asset-kpi"><small>عقود تنتهي خلال 60 يومًا</small><b>${soon}</b><span>قرار تجديد / إنهاء</span></div><div class="asset-kpi"><small>أصول تحتاج متابعة فنية</small><b>${maintenance}</b><span>صيانة أو فحص</span></div></div><div class="asset-tabs"><button class="active" onclick="assetTab('overview')">لوحة الرقابة</button><button onclick="assetTab('vehicles')">السيارات وخطوط السير</button><button onclick="assetTab('trips')">المأموريات والانحرافات</button><button onclick="assetTab('rentals')">الشقق والعقود</button><button onclick="assetTab('equipment')">المعدات والأصول</button><button onclick="assetTab('reports')">التقارير والتصدير</button></div><div id="assetPane"></div>`;assetTab('overview')}
function assetTab(tab){document.querySelectorAll('.asset-tabs button').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick')===`assetTab('${tab}')`));const pane=document.getElementById('assetPane');if(!pane)return;const v=assetRead('vehicles'),t=assetRead('trips'),r=assetRead('rentals'),e=assetRead('equipment');if(tab==='overview'){const alerts=[];t.filter(x=>x.status!=='مغلق').forEach(x=>alerts.push(`<tr><td>مأمورية ${esc(x.id)}</td><td>المسافة المتوقعة ${assetNum(x.expected)} كم — المسافة المسجلة ${assetNum(Math.max(0,x.end-x.start))} كم</td><td><span class="asset-pill warn">تحتاج مراجعة</span></td><td><button class="btn gold" onclick="assetTab('trips')">فتح</button></td></tr>`));r.forEach(x=>{const days=Math.ceil((new Date(x.end)-new Date())/86400000);if(days<=60)alerts.push(`<tr><td>${esc(x.id)}</td><td>${esc(x.location)} — انتهاء ${esc(x.end)} (${days<0?'منتهي':days+' يوم'})</td><td><span class="asset-pill warn">قرار مطلوب</span></td><td><button class="btn gold" onclick="assetTab('rentals')">فتح</button></td></tr>`)});e.filter(x=>x.condition!=='صالح').forEach(x=>alerts.push(`<tr><td>${esc(x.id)}</td><td>${esc(x.name)} — ${esc(x.condition)}</td><td><span class="asset-pill warn">متابعة فنية</span></td><td><button class="btn gold" onclick="assetTab('equipment')">فتح</button></td></tr>`));pane.innerHTML=`<div class="asset-panel"><h3>الاستثناءات والإجراءات المطلوبة</h3><p class="muted">الأولوية للحالات التي تتطلب قرارًا أو مستندًا أو إقفالًا.</p><div class="table-scroll"><table class="table"><thead><tr><th>الحالة</th><th>التفاصيل</th><th>التصنيف</th><th>الإجراء</th></tr></thead><tbody>${alerts.length?alerts.join(''):'<tr><td colspan="4">لا توجد استثناءات مسجلة وفق البيانات الحالية.</td></tr>'}</tbody></table></div></div><div class="asset-panel"><h3>مبادئ الرقابة</h3><div class="asset-rulegrid"><div>01 <b>لا مأمورية بلا تكليف</b><small>غرض ووجهة ومسافة تقديرية معتمدة.</small></div><div>02 <b>لا إقفال بلا مطابقة</b><small>قراءة عداد ووقود وشرح الانحراف.</small></div><div>03 <b>لا تجديد بلا حاجة</b><small>مراجعة الإشغال والتكلفة قبل القرار.</small></div><div>04 <b>لا أصل بلا عهدة</b><small>موقع ومسؤول وحالة فنية وسجل حركة.</small></div></div></div>`;return}if(tab==='vehicles'){pane.innerHTML=`<div class="asset-panel"><div class="asset-panelhead"><div><h3>سجل السيارات</h3><p class="muted">إضافة السيارات وتحديث حالة التشغيل وقراءة العداد.</p></div><button class="btn gold" onclick="assetVehicleForm()">+ إضافة سيارة</button></div><div class="table-scroll"><table class="table"><thead><tr><th>الكود</th><th>النوع / اللوحة</th><th>المسؤول</th><th>العداد كم</th><th>الاستهلاك ل/100كم</th><th>الحالة</th><th>التكليف</th></tr></thead><tbody>${v.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.type)}<br><small>${esc(x.plate)}</small></td><td>${esc(x.driver)}</td><td>${assetNum(x.odometer)}</td><td>${assetNum(x.fuelRate)}</td><td>${esc(x.status)}</td><td><button class="btn blue" onclick="assetTripForm('${esc(x.id)}')">إنشاء مأمورية</button> <button class="btn" onclick="assetOdoForm('${esc(x.id)}')">تحديث العداد</button></td></tr>`).join('')}</tbody></table></div></div>`;return}if(tab==='trips'){pane.innerHTML=`<div class="asset-panel"><div class="asset-panelhead"><div><h3>المأموريات ومطابقة خط السير</h3><p class="muted">المسافة = قراءة النهاية − قراءة البداية. أي فرق يحتاج تفسيرًا ومراجعة.</p></div><button class="btn gold" onclick="assetTripForm('')">+ مأمورية جديدة</button></div><div class="table-scroll"><table class="table"><thead><tr><th>رقم المأمورية</th><th>السيارة / الوجهة</th><th>المتوقعة</th><th>الفعلية</th><th>الانحراف</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody>${t.map(x=>{const actual=Math.max(0,(Number(x.end)||0)-(Number(x.start)||0)),delta=actual-(Number(x.expected)||0),pct=Number(x.expected)?delta/Number(x.expected)*100:0;return `<tr><td>${esc(x.id)}<br><small>${esc(x.date)}</small></td><td>${esc(x.vehicle)}<br>${esc(x.from)} ← ${esc(x.to)}</td><td>${assetNum(x.expected)} كم</td><td>${assetNum(actual)} كم</td><td><b style="color:${delta>Math.max(10,Number(x.expected)*.15)?'var(--red)':'var(--navy)'}">${delta>0?'+':''}${assetNum(delta)} كم (${pct.toFixed(1)}%)</b></td><td><span class="asset-pill ${x.status==='مغلق'?'ok':'warn'}">${esc(x.status)}</span></td><td><button class="btn gold" onclick="assetTripReview('${esc(x.id)}')">مراجعة / إقفال</button></td></tr>`}).join('')}</tbody></table></div></div>`;return}if(tab==='rentals'){pane.innerHTML=`<div class="asset-panel"><div class="asset-panelhead"><div><h3>العقارات والوحدات المؤجرة</h3><p class="muted">متابعة الغرض والإشغال والقيمة وموعد الانتهاء وقرار التجديد.</p></div><button class="btn gold" onclick="assetRentalForm()">+ إضافة عقد</button></div><div class="table-scroll"><table class="table"><thead><tr><th>الكود / النوع</th><th>الموقع / المستفيد</th><th>الإيجار الشهري</th><th>انتهاء العقد</th><th>الإشغال</th><th>الالتزام المتبقي التقريبي</th><th>القرار</th></tr></thead><tbody>${r.map(x=>{const days=Math.ceil((new Date(x.end)-new Date())/86400000),months=Math.max(0,Math.ceil(days/30));return `<tr><td>${esc(x.id)}<br>${esc(x.kind)}</td><td>${esc(x.location)}<br><small>${esc(x.beneficiary)}</small></td><td>${assetNum(x.monthly)} ج.م</td><td>${esc(x.end)}<br><small>${days<0?'انتهى التاريخ المسجل':days+' يوم متبقٍ'}</small></td><td>${esc(x.status)}</td><td>${assetNum(Number(x.monthly)*months)} ج.م*</td><td><button class="btn gold" onclick="assetRentalReview('${esc(x.id)}')">مراجعة العقد</button></td></tr>`}).join('')}</tbody></table></div><small class="muted">* تقدير تقريبي على أساس أشهر متبقية، لا يمثل قيمة واجبة الدفع أو التزامًا محاسبيًا نهائيًا.</small></div>`;return}if(tab==='equipment'){pane.innerHTML=`<div class="asset-panel"><div class="asset-panelhead"><div><h3>سجل المعدات والأصول المملوكة</h3><p class="muted">العهدة والموقع والحالة الفنية والصيانة.</p></div><button class="btn gold" onclick="assetEquipmentForm()">+ إضافة أصل</button></div><div class="table-scroll"><table class="table"><thead><tr><th>الكود / الأصل</th><th>الرقم المسلسل</th><th>الموقع</th><th>مسؤول العهدة</th><th>الحالة</th><th>آخر صيانة</th><th>الإجراء</th></tr></thead><tbody>${e.map(x=>`<tr><td>${esc(x.id)}<br>${esc(x.name)}</td><td>${esc(x.serial)}</td><td>${esc(x.location)}</td><td>${esc(x.custodian)}</td><td>${esc(x.condition)}</td><td>${esc(x.lastService)}</td><td><button class="btn gold" onclick="assetEquipmentReview('${esc(x.id)}')">تحديث الحالة</button></td></tr>`).join('')}</tbody></table></div></div>`;return}if(tab==='reports'){pane.innerHTML=`<div class="asset-panel"><h3>التقارير الرقابية</h3><p class="muted">تصدير سجلات النموذج التجريبي للمراجعة في Excel.</p><div class="asset-actions"><button class="btn gold" onclick="assetExport('vehicles')">تصدير السيارات CSV</button><button class="btn gold" onclick="assetExport('trips')">تصدير المأموريات CSV</button><button class="btn gold" onclick="assetExport('rentals')">تصدير العقود CSV</button><button class="btn gold" onclick="assetExport('equipment')">تصدير الأصول CSV</button><button class="btn blue" onclick="assetExport('all')">تصدير تقرير شامل</button></div><div class="notice" style="margin-top:18px">يجب مراجعة الملفات المصدرة قبل استخدامها رسميًا؛ جميع السجلات الحالية توضيحية ومحفوظة محليًا.</div></div>`}}
function assetVehicleForm(){document.getElementById('assetPane').innerHTML=`<div class="asset-panel"><button class="back" onclick="assetTab('vehicles')">← رجوع</button><h3>إضافة سيارة</h3><form class="asset-form" onsubmit="assetSaveVehicle(event)"><label>كود السيارة<input name="id" required placeholder="CAR-004"></label><label>النوع<input name="type" required></label><label>رقم اللوحة<input name="plate" required></label><label>المسؤول / السائق<input name="driver" required></label><label>قراءة العداد الحالية كم<input name="odometer" type="number" min="0" required></label><label>معدل الاستهلاك لتر/100 كم<input name="fuelRate" type="number" min="0" step="0.1" required></label><label>الملكية<select name="lease"><option>مملوكة</option><option>مؤجرة</option></select></label><label>الحالة<select name="status"><option>متاحة</option><option>في مأمورية</option><option>صيانة</option></select></label><button class="btn gold">حفظ السيارة تجريبيًا</button></form></div>`}
function assetSaveVehicle(ev){ev.preventDefault();const f=new FormData(ev.target),a=assetRead('vehicles');if(a.some(x=>x.id===f.get('id'))){toast('كود السيارة موجود بالفعل');return}a.push(Object.fromEntries(f));assetWrite('vehicles',a);toast('تم حفظ السيارة في هذا المتصفح');assetTab('vehicles')}
function assetTripForm(vehicleId){const v=assetRead('vehicles'),car=v.find(x=>x.id===vehicleId),odo=car?.odometer||0;document.getElementById('assetPane').innerHTML=`<div class="asset-panel"><button class="back" onclick="assetTab('trips')">← رجوع</button><h3>إنشاء مأمورية</h3><form class="asset-form" onsubmit="assetSaveTrip(event)"><label>رقم المأمورية<input name="id" required value="TR-${new Date().getFullYear()}-${String(Date.now()).slice(-5)}"></label><label>السيارة<select name="vehicle">${v.map(x=>`<option value="${esc(x.id)}" ${x.id===vehicleId?'selected':''}>${esc(x.id)} — ${esc(x.plate)}</option>`).join('')}</select></label><label>الغرض<input name="purpose" required></label><label>نقطة البداية<input name="from" required value="فرع شمال الصعيد"></label><label>الوجهة / نقاط التوقف<input name="to" required></label><label>المسافة التقديرية ذهابًا وعودة كم<input name="expected" type="number" min="1" required></label><label>قراءة عداد البداية<input name="start" type="number" min="0" value="${odo}" required></label><label>التاريخ<input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></label><label>ملاحظات<textarea name="notes" rows="2"></textarea></label><button class="btn gold">حفظ التكليف التجريبي</button></form></div>`}
function assetSaveTrip(ev){ev.preventDefault();const f=new FormData(ev.target),a=assetRead('trips'),o=Object.fromEntries(f);o.expected=Number(o.expected);o.start=Number(o.start);o.end=o.start;o.fuel=0;o.status='مفتوح';a.push(o);assetWrite('trips',a);const vs=assetRead('vehicles'),car=vs.find(x=>x.id===o.vehicle);if(car)car.status='في مأمورية';assetWrite('vehicles',vs);toast('تم حفظ التكليف محليًا — يلزم تسجيل قراءة العودة لاحقًا');assetTab('trips')}
function assetOdoForm(id){const x=assetRead('vehicles').find(v=>v.id===id);document.getElementById('assetPane').innerHTML=`<div class="asset-panel"><button class="back" onclick="assetTab('vehicles')">← رجوع</button><h3>تحديث قراءة العداد — ${esc(id)}</h3><form class="asset-form" onsubmit="assetSaveOdo(event,'${esc(id)}')"><label>قراءة العداد الجديدة كم<input name="odo" type="number" min="${Number(x.odometer)||0}" value="${Number(x.odometer)||0}" required></label><label>سبب التحديث<input name="reason" required></label><button class="btn gold">حفظ القراءة</button></form></div>`}
function assetSaveOdo(ev,id){ev.preventDefault();const f=new FormData(ev.target),a=assetRead('vehicles'),x=a.find(v=>v.id===id),n=Number(f.get('odo'));if(n<Number(x.odometer)){toast('لا يمكن تخفيض قراءة العداد دون إجراء تصحيح موثق');return}x.odometer=n;x.notes=(x.notes||'')+' | تحديث عداد: '+f.get('reason');assetWrite('vehicles',a);toast('تم تحديث قراءة العداد تجريبيًا');assetTab('vehicles')}
function assetTripReview(id){const a=assetRead('trips'),x=a.find(t=>t.id===id);if(!x)return;document.getElementById('assetPane').innerHTML=`<div class="asset-panel"><button class="back" onclick="assetTab('trips')">← رجوع</button><h3>مراجعة المأمورية ${esc(id)}</h3><form class="asset-form" onsubmit="assetSaveTripReview(event,'${esc(id)}')"><label>قراءة عداد العودة<input name="end" type="number" min="${Number(x.start)||0}" value="${Number(x.end)||Number(x.start)||0}" required></label><label>كمية الوقود باللتر<input name="fuel" type="number" min="0" step="0.1" value="${Number(x.fuel)||0}" required></label><label>سبب الانحراف / الملاحظات<textarea name="notes" required rows="3">${esc(x.notes||'')}</textarea></label><label>الإجراء<select name="status"><option ${x.status==='مراجعة'?'selected':''}>مراجعة</option><option ${x.status==='مغلق'?'selected':''}>مغلق</option><option>مطلوب استكمال</option></select></label><div class="notice">المسافة الفعلية: ${assetNum(Math.max(0,(Number(x.end)||0)-(Number(x.start)||0)))} كم. يجب التحقق من التفسير قبل إقفال المأمورية.</div><button class="btn gold">حفظ المراجعة التجريبية</button></form></div>`}
function assetSaveTripReview(ev,id){ev.preventDefault();const f=new FormData(ev.target),a=assetRead('trips'),x=a.find(t=>t.id===id);x.end=Number(f.get('end'));x.fuel=Number(f.get('fuel'));x.notes=f.get('notes');x.status=f.get('status');assetWrite('trips',a);if(x.status==='مغلق'){const v=assetRead('vehicles'),car=v.find(c=>c.id===x.vehicle);if(car){car.status='متاحة';car.odometer=Math.max(Number(car.odometer)||0,x.end)}assetWrite('vehicles',v)}toast('تم حفظ المراجعة التجريبية؛ لا يوجد اعتماد مالي فعلي');assetTab('trips')}
function assetRentalForm(){document.getElementById('assetPane').innerHTML=`<div class="asset-panel"><button class="back" onclick="assetTab('rentals')">← رجوع</button><h3>إضافة عقد إيجار</h3><form class="asset-form" onsubmit="assetSaveRental(event)"><label>كود العقد<input name="id" required placeholder="APT-003"></label><label>نوع الوحدة<input name="kind" required></label><label>الموقع<input name="location" required></label><label>المستفيد<input name="beneficiary" required></label><label>الغرض من الإيجار<input name="purpose" required></label><label>الإيجار الشهري جنيه<input name="monthly" type="number" min="0" required></label><label>بداية العقد<input name="start" type="date" required></label><label>نهاية العقد<input name="end" type="date" required></label><label>حالة الإشغال<select name="status"><option>مشغولة</option><option>غير مشغولة</option><option>يحتاج مراجعة</option></select></label><label>ملاحظات<textarea name="notes"></textarea></label><button class="btn gold">حفظ العقد التجريبي</button></form></div>`}
function assetSaveRental(ev){ev.preventDefault();const f=new FormData(ev.target),a=assetRead('rentals'),o=Object.fromEntries(f);o.monthly=Number(o.monthly);if(o.end<o.start){toast('تاريخ نهاية العقد يجب أن يكون بعد البداية');return}if(a.some(x=>x.id===o.id)){toast('كود العقد موجود بالفعل');return}a.push(o);assetWrite('rentals',a);toast('تم حفظ العقد محليًا');assetTab('rentals')}
function assetRentalReview(id){const a=assetRead('rentals'),x=a.find(r=>r.id===id);document.getElementById('assetPane').innerHTML=`<div class="asset-panel"><button class="back" onclick="assetTab('rentals')">← رجوع</button><h3>مراجعة العقد ${esc(id)}</h3><form class="asset-form" onsubmit="assetSaveRentalReview(event,'${esc(id)}')"><label>حالة الإشغال<select name="status"><option ${x.status==='مشغولة'?'selected':''}>مشغولة</option><option ${x.status==='غير مشغولة'?'selected':''}>غير مشغولة</option><option ${x.status==='يحتاج مراجعة'?'selected':''}>يحتاج مراجعة</option></select></label><label>قرار التجديد<select name="decision"><option>لم يحسم</option><option>مقترح التجديد بعد إثبات الحاجة</option><option>مقترح عدم التجديد</option><option>إحالة للشؤون القانونية والمالية</option></select></label><label>مبررات القرار / إثبات الحاجة<textarea name="notes" rows="3" required>${esc(x.notes||'')}</textarea></label><button class="btn gold">حفظ نتيجة المراجعة</button></form><p class="muted">هذا تسجيل مراجعة فقط ولا ينهي العقد ولا يوقف أي دفعة.</p></div>`}
function assetSaveRentalReview(ev,id){ev.preventDefault();const f=new FormData(ev.target),a=assetRead('rentals'),x=a.find(r=>r.id===id);x.status=f.get('status');x.decision=f.get('decision');x.notes=f.get('notes');assetWrite('rentals',a);toast('تم حفظ نتيجة المراجعة محليًا');assetTab('rentals')}
function assetEquipmentForm(){document.getElementById('assetPane').innerHTML=`<div class="asset-panel"><button class="back" onclick="assetTab('equipment')">← رجوع</button><h3>إضافة أصل أو معدة</h3><form class="asset-form" onsubmit="assetSaveEquipment(event)"><label>كود الأصل<input name="id" required></label><label>اسم الأصل<input name="name" required></label><label>الرقم المسلسل<input name="serial" required></label><label>الموقع الحالي<input name="location" required></label><label>مسؤول العهدة<input name="custodian" required></label><label>الحالة الفنية<select name="condition"><option>صالح</option><option>يحتاج صيانة</option><option>متوقف</option></select></label><label>آخر صيانة<input name="lastService" type="date"></label><label>ساعات التشغيل<input name="hours" type="number" min="0" value="0"></label><label>ملاحظات<textarea name="notes"></textarea></label><button class="btn gold">حفظ الأصل التجريبي</button></form></div>`}
function assetSaveEquipment(ev){ev.preventDefault();const f=new FormData(ev.target),a=assetRead('equipment'),o=Object.fromEntries(f);o.hours=Number(o.hours);if(a.some(x=>x.id===o.id)){toast('كود الأصل موجود بالفعل');return}a.push(o);assetWrite('equipment',a);toast('تم حفظ الأصل محليًا');assetTab('equipment')}
function assetEquipmentReview(id){const a=assetRead('equipment'),x=a.find(o=>o.id===id);document.getElementById('assetPane').innerHTML=`<div class="asset-panel"><button class="back" onclick="assetTab('equipment')">← رجوع</button><h3>تحديث حالة الأصل ${esc(id)}</h3><form class="asset-form" onsubmit="assetSaveEquipmentReview(event,'${esc(id)}')"><label>الموقع الحالي<input name="location" value="${esc(x.location)}" required></label><label>مسؤول العهدة<input name="custodian" value="${esc(x.custodian)}" required></label><label>الحالة الفنية<select name="condition"><option>صالح</option><option ${x.condition==='يحتاج صيانة'?'selected':''}>يحتاج صيانة</option><option ${x.condition==='متوقف'?'selected':''}>متوقف</option></select></label><label>تاريخ آخر صيانة<input name="lastService" type="date" value="${esc(x.lastService||'')}"></label><label>ملاحظات<textarea name="notes">${esc(x.notes||'')}</textarea></label><button class="btn gold">حفظ التحديث</button></form></div>`}
function assetSaveEquipmentReview(ev,id){ev.preventDefault();const f=new FormData(ev.target),a=assetRead('equipment'),x=a.find(o=>o.id===id);Object.assign(x,Object.fromEntries(f));assetWrite('equipment',a);toast('تم تحديث سجل الأصل محليًا');assetTab('equipment')}
function assetExport(k){const keys=k==='all'?['vehicles','trips','rentals','equipment']:[k];for(const key of keys){const rows=assetRead(key),headers=[...new Set(rows.flatMap(o=>Object.keys(o)))],csv=[headers,...rows.map(o=>headers.map(h=>o[h]??''))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='asset_control_'+key+'_demo.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}}

function admin(){document.getElementById('inside').innerHTML=`<div class="welcome"><div><h1>مرحبًا، ${esc(current.name)}</h1><p>لوحة تحكم تقنية المعلومات لإدارة محتوى الموقع والمستخدمين والصلاحيات.</p></div><b>IT Administrator</b></div><h2 style="color:var(--navy)">الإدارة السريعة</h2><div class="itgrid">${[['appointments','▦','طلبات تحديد المواعيد','عرض طلبات الزوار المسجلة في هذا المتصفح.'],['home','⌂','إدارة الصفحة الرئيسية','تعديل النصوص والصور والروابط.'],['content','▤','إدارة المحتوى','الأخبار والقرارات والمنشورات.'],['users','♟','إدارة الموظفين','إضافة وتعديل وتفعيل الحسابات.'],['permissions','◈','إدارة الصلاحيات','الأدوار والوصول للمنصات.'],['projects','▥','إدارة المشروعات','إضافة وتحديث المشروعات والإنجازات.'],['gallery','▧','معرض الصور','رفع الصور وترتيبها.'],['month','★','موظف الشهر','إضافة بيانات التكريم والنشر.'],['settings','⚙','الإعدادات العامة','العنوان والاتصال والبريد.']].map(x=>`<div class="itcard" onclick="itAction('${x[0]}')"><div class="icon">${x[1]}</div><h3>${x[2]}</h3><p>${x[3]}</p></div>`).join('')}</div><div class="panel" style="margin-top:20px"><h3 style="color:var(--navy)">سجل التعديلات</h3><table class="table"><tr><th>المستخدم</th><th>العملية</th><th>القسم</th><th>الحالة</th></tr><tr><td>${esc(current.name)}</td><td>تسجيل دخول</td><td>النظام</td><td>ناجح</td></tr><tr><td>${esc(current.name)}</td><td>مراجعة الصلاحيات</td><td>الموظفون</td><td>مكتمل</td></tr></table></div>`}
function itAction(k){if(k==='appointments'){appointmentInbox();return}const labels={home:'إدارة الصفحة الرئيسية',content:'إدارة المحتوى',users:'إدارة الموظفين',permissions:'إدارة الصلاحيات',projects:'إدارة المشروعات',gallery:'معرض الصور',month:'موظف الشهر',settings:'الإعدادات العامة'};document.getElementById('inside').innerHTML=`<button class="back" onclick="admin()">← العودة للوحة IT</button><div class="panel"><h2 style="color:var(--navy)">${labels[k]}</h2><p>هذه الشاشة مخصصة لموظف IT لإجراء التعديلات وحفظها. في النسخة الإنتاجية سيتم ربطها بقاعدة البيانات وتسجيل كل تعديل.</p><label>مثال على التعديل</label><input placeholder="أدخل البيانات الجديدة"><button class="btn gold" style="margin-top:15px" onclick="toast('تم حفظ التعديل في النسخة التجريبية')">حفظ التعديل</button></div>`}
function logout(){document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML=`<div class="modalbox"><h3 style="color:var(--navy)">تأكيد تسجيل الخروج</h3><p>هل تريد تسجيل الخروج؟</p><button class="btn" onclick="closeModal()">إلغاء</button> <button class="btn gold" onclick="confirmLogout()">تسجيل الخروج</button></div>`}
function closeModal(){document.getElementById('modal').className='hidden';document.getElementById('modal').innerHTML=''}function confirmLogout(){current=null;closeModal();try{localStorage.removeItem('northPortalSession');localStorage.removeItem('northRemember')}catch(e){}window.location.href='employee-portal.html?logout=1'}
function initPortal(){let session=null;try{session=JSON.parse(localStorage.getItem('northPortalSession')||'null')}catch(e){}const id=session&&session.u;const acct=id&&accounts[id];if(acct){current={...acct,id};internal();const section=new URLSearchParams(window.location.search).get('section');if(section&&['hr','warehouse','reports','employee','training','complaints','decisions','announcements','assets','admin'].includes(section)){service(section)}}else{home()}}
initPortal();
</script></body></html>
